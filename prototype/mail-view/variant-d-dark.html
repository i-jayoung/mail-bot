<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>D · 深色阅读</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", sans-serif;
      background: #0d0d0f;
      color: #e5e5ea;
      min-height: 100vh;
      line-height: 1.5;
    }
    .shell {
      max-width: 780px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #2a2a2e;
    }
    .brand {
      font-size: 13px;
      font-weight: 600;
      color: #8e8e93;
      letter-spacing: .04em;
    }
    .pill {
      font-size: 12px;
      color: #aeaeb2;
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .card {
      background: #1c1c1e;
      border: 1px solid #2a2a2e;
      border-radius: 16px;
      overflow: hidden;
    }
    .card-head {
      padding: 24px 24px 20px;
      border-bottom: 1px solid #2a2a2e;
    }
    .subject {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      font-size: 13px;
      color: #8e8e93;
    }
    .meta-row span { color: #e5e5ea; }
    .content {
      padding: 20px;
      background: #141416;
    }
    .mail-frame {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      overflow-x: auto;
    }
    .mail-frame-inner {
      padding: 8px;
    }
    @media (max-width: 520px) {
      .card-head { padding: 18px 16px; }
      .subject { font-size: 19px; }
      .content { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="toolbar">
      <span class="brand">5o.vc · Mail</span>
      <span class="pill">深色模式</span>
    </header>

    <article class="card">

          <div>收件 <span>askdhkashjd@5o.vc</span></div>
          <div>时间 <span>8/24 13:25</span></div>
        </div>
      </div>

      <div class="content">
        <div class="mail-frame">

            <div style="max-width:560px;margin:0 auto;font-family:Roboto,Arial,sans-serif;color:#202124;">

              </div>
              <h2 style="font-size:24px;font-weight:400;text-align:center;margin:0 0 24px;">辅助电话号码发生了变更</h2>
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
                <div style="width:40px;height:40px;border-radius:50%;background:#e8eaed;display:flex;align-items:center;justify-content:center;">👤</div>
                <span style="font-size:14px;color:#5f6368;">9782586@gmail.com</span>
              </div>
              <p style="font-size:14px;line-height:1.6;color:#5f6368;margin:0 0 28px;">您的 Google 账号 9782586@gmail.com 的辅助电话号码已更改。如果不是您本人操作，请立即检查账号活动。</p>

              </div>

          </div>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
