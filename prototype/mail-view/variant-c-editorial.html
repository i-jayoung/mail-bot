<!DOCTYPE html>

    body {
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      background: #faf8f5;
      color: #2c2417;
      line-height: 1.6;
    }
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    .masthead {
      text-align: center;
      padding-bottom: 28px;
      border-bottom: 2px solid #2c2417;
      margin-bottom: 32px;
    }
    .masthead-label {
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #8a7b6a;
      margin-bottom: 12px;
    }
    .subject {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -.01em;
    }
    .byline {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 0 24px;
      border-bottom: 1px solid #d4cdc3;
      margin-bottom: 32px;
      font-size: 14px;
      color: #6b5f50;
    }
    .byline strong { color: #2c2417; font-weight: 500; }
    .divider {
      text-align: center;
      margin: 28px 0;
      font-size: 12px;
      color: #a89885;
      letter-spacing: .15em;
    }
    .divider::before,
    .divider::after {
      content: "";
      display: inline-block;
      width: 40px;
      height: 1px;
      background: #d4cdc3;
      vertical-align: middle;
      margin: 0 12px;
    }
    .article {
      background: #fff;
      border: 1px solid #e8e2d9;
      padding: 32px 28px;
    }
    .article-inner {
      overflow-x: auto;
    }
    .footer-note {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: #a89885;
    }
    @media (max-width: 520px) {
      .page { padding-top: 28px; }
      .article { padding: 20px 16px; }
    }
  </style>
</head>
