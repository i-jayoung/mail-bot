<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>邮件查看页 · 设计示例</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", system-ui, sans-serif;
      background: #111;
      color: #eee;
      min-height: 100vh;
    }
    .hero {
      padding: 48px 24px 32px;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; }
    p { margin: 0; color: #999; line-height: 1.6; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      overflow: hidden;
      transition: border-color .2s, transform .2s;
    }
    a.card:hover {
      border-color: #555;
      transform: translateY(-2px);
    }
    .thumb {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    .info { padding: 16px 18px 20px; }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
    }
    .name { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .desc { font-size: 13px; color: #888; line-height: 1.5; }
    .a .thumb { background: linear-gradient(135deg, #f8f9fa, #e9ecef); }
    .b .thumb { background: linear-gradient(135deg, #dfe6eb, #c8d6e0); }
    .c .thumb { background: linear-gradient(135deg, #faf8f5, #ebe6df); color: #5c4d3c; }
    .d .thumb { background: linear-gradient(135deg, #1c1c1e, #2c2c2e); }
  </style>
</head>
<body>
  <div class="hero">
    <h1>邮件查看页 · 4 套设计示例</h1>
    <p>用同一封 Google 安全提醒邮件做演示。点开任意卡片预览，选定风格后告诉我编号即可。</p>
  </div>
  <div class="grid">
    <a class="card a" href="variant-a-gmail.html" target="_blank">
      <div class="thumb">A</div>
      <div class="info">
        <div class="tag">Variant A</div>
        <div class="name">Gmail 阅读器</div>
        <div class="desc">极简白底、少装饰，正文占满屏幕，像原生邮件客户端。</div>
      </div>
    </a>
    <a class="card b" href="variant-b-telegram.html" target="_blank">
      <div class="thumb">B</div>
      <div class="info">
        <div class="tag">Variant B</div>
        <div class="name">Telegram 风格</div>
        <div class="desc">与 Bot 推送一致的蓝灰背景 + 白色气泡，过渡自然。</div>
      </div>
    </a>
    <a class="card c" href="variant-c-editorial.html" target="_blank">
      <div class="thumb">C</div>
      <div class="info">
        <div class="tag">Variant C</div>
        <div class="name">报刊排版</div>
        <div class="desc">衬线大标题、细线分隔，偏阅读感，适合长邮件。</div>
      </div>
    </a>
    <a class="card d" href="variant-d-dark.html" target="_blank">
      <div class="thumb">D</div>
      <div class="info">
        <div class="tag">Variant D</div>
        <div class="name">深色阅读</div>
        <div class="desc">暗色界面，正文仍保持邮件原色，夜间友好。</div>
      </div>
    </a>
  </div>
</body>
</html>
