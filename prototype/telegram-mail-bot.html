<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>邮件助手 · 精简原型</title>
  <style>
    :root { --tg-blue: #3390ec; --out: #eeffde; --in: #fff; --chat-bg: #8eb0c9; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC", system-ui, sans-serif; background: #d8dee6; }
    .page { display: grid; grid-template-columns: 300px 390px; gap: 32px; justify-content: center; padding: 40px 20px; }
    .side p { color: #4a5560; font-size: 14px; line-height: 1.6; }
    .chip { border: 0; background: #fff; padding: 8px 12px; border-radius: 999px; margin: 4px; cursor: pointer; }
    .phone { width: 390px; height: 780px; background: #0b0b0c; border-radius: 40px; padding: 10px; }
    .bezel { height: 100%; background: var(--chat-bg); border-radius: 32px; display: flex; flex-direction: column; overflow: hidden; }
    .header { background: #f4f4f5; padding: 12px; font-weight: 600; }
    .msgs { flex: 1; overflow-y: auto; padding: 12px 8px; }
    .row { display: flex; margin-bottom: 8px; }
    .row.me { justify-content: flex-end; }
    .bubble { max-width: 85%; padding: 8px 11px; border-radius: 14px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
    .row.bot .bubble { background: var(--in); }
    .row.me .bubble { background: var(--out); }
    .composer { background: #f0f0f2; padding: 8px; display: flex; gap: 8px; }
    #draft { flex: 1; border: 0; border-radius: 16px; padding: 8px 12px; font: inherit; }
    #go { border: 0; background: var(--tg-blue); color: #fff; border-radius: 50%; width: 32px; height: 32px; }
  </style>
</head>
<body>
  <div class="page">
    <aside class="side">
      <h1>三步代发</h1>
      <p>① 发正文 abc<br>② 设发件（默认 bot@5o.vc，回复 1）<br>③ 填收件地址 → 发出</p>
      <button class="chip" id="demo">演示</button>
    </aside>
    <div class="phone">
      <div class="bezel">
        <div class="header">📬 邮件助手</div>
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <input id="draft" placeholder="发文字…" />
          <button id="go">↑</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const FROM = "bot@5o.vc";
    const msgs = document.getElementById("msgs");
    const draft = document.getElementById("draft");
    let step = null;
    let body = "";

    function add(who, text) {
      const row = document.createElement("div");
      row.className = "row " + who;
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = text;
      row.appendChild(b);
      msgs.appendChild(row);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function submit(t) {
      t = t.trim();
      if (!t && step !== "from") return;
      if (t) add("me", t || "（默认）");
      draft.value = "";

      if (t === "/start") { step = null; msgs.innerHTML = ""; add("bot", "发文字即可代发邮件。"); return; }
      if (t === "/cancel" || t === "取消") { step = null; add("bot", "已取消。"); return; }

      if (!step) {
        body = t;
        step = "from";
        add("bot", `📤 请设置发件邮箱\n⚙️ 默认 ${FROM}\n✏️ 也可发自定义地址\n👆 使用默认请回复 1`);
        return;
      }
      if (step === "from") {
        const from = (!t || t === "1" || t === "默认") ? FROM : t;
        step = "to";
        add("bot", "📥 请填写收件邮箱地址");
        window._from = from;
        return;
      }
      if (step === "to") {
        add("bot", `✅ 已从 ${window._from || FROM} 发送到 ${t}\n正文：${body}`);
        step = null;
      }
    }

    document.getElementById("go").onclick = () => submit(draft.value);
    draft.onkeydown = (e) => { if (e.key === "Enter") submit(draft.value); };
    document.getElementById("demo").onclick = () => {
      msgs.innerHTML = ""; step = null;
      submit("abc");
      setTimeout(() => submit("1"), 400);
      setTimeout(() => submit("user@example.com"), 800);
    };
    add("bot", "发文字即可代发邮件。");
  </script>
</body>
</html>
